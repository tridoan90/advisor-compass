<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F4">
<title>Advisor Compass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Lora:ital,wght@1,400;1,500&display=swap">
<style>
/* Single deliberate light "glass" world — every color set explicitly */
:root{
  color-scheme:light;
  --crimson:#ED1B2E; --crimson-hi:#FF4658; --crimson-lo:#A90E1D;
  --whiskey:#B9804F; --whiskey-hi:#CE9B74; --riverbed:#455560; --riverbed-hi:#7D909D;
  --bg0:#F7F3EF; --bg1:#FFFFFF; --bg2:#EEF2F5;
  --ink:#18222A; --ink-2:#44525C; --mute:#76848E; --faint:#9AA6AE;
  --line:rgba(69,85,96,.12); --line-2:rgba(69,85,96,.20);
  --g1:rgba(255,255,255,.55); --g2:rgba(255,255,255,.80); --g3:rgba(255,255,255,.92);
  --surface:#FFFFFF; --surface-2:rgba(255,255,255,.7);
  --chip:rgba(206,155,116,.18); --chip-ink:#8A5A33;
  --ok:#1F8A5E; --ok-bg:rgba(31,138,94,.12); --warn:#A86A00; --warn-bg:rgba(230,160,30,.16);
  --hi:#C8501C; --hi-bg:rgba(232,110,50,.14); --crit:#C8102E; --crit-bg:rgba(237,27,46,.11);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --blur:saturate(160%) blur(22px);
  --edge:inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.7), 0 0 0 1px rgba(69,85,96,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-weight:400;letter-spacing:-.005em;
  background:
    radial-gradient(900px 620px at 105% -8%, rgba(255,94,110,.34), transparent 60%),
    radial-gradient(820px 640px at -18% 28%, rgba(146,180,204,.45), transparent 62%),
    radial-gradient(760px 620px at 85% 105%, rgba(236,190,150,.55), transparent 62%),
    linear-gradient(165deg, #FFF8F4 0%, #F4F7FA 55%, #FBF1EA 100%);
  background-attachment:fixed; background-color:var(--bg0)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(rgba(69,85,96,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(69,85,96,.05) 1px,transparent 1px);
  background-size:44px 44px; mask-image:radial-gradient(ellipse at 50% 20%, #000 20%, transparent 75%)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
/* Layer 1 — top bar glass */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px;
  background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.55));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark svg{flex:none;filter:drop-shadow(0 2px 6px rgba(237,27,46,.25))}
.mark b{font-weight:600;letter-spacing:.02em;font-size:15px}
.mark small{display:block;font-size:10px;color:var(--mute);letter-spacing:.16em;text-transform:uppercase;font-weight:500;line-height:1.3}
.lang{display:flex;border-radius:999px;padding:3px;flex:none;background:var(--g1);box-shadow:var(--edge)}
.lang button{border:0;background:none;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--mute);cursor:pointer}
.lang button[aria-pressed="true"]{background:linear-gradient(135deg,var(--crimson-hi),var(--crimson));color:#fff;box-shadow:0 3px 10px rgba(237,27,46,.3)}
.iconbtn{border:0;background:var(--g1);box-shadow:var(--edge);padding:6px;border-radius:12px;cursor:pointer;color:var(--ink-2);display:flex}
main{flex:1;padding:22px 16px 120px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.025em;margin:0 0 8px;font-weight:300;text-wrap:balance}
h1 em{font-style:normal;font-weight:600;background:linear-gradient(90deg,var(--crimson),var(--whiskey));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:13px;margin:0;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.lede{color:var(--ink-2);margin:0 0 20px;font-weight:300}
.eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--mute)}
/* progress */
.prog{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin:0 0 18px}
.prog i{height:3px;border-radius:2px;background:var(--line)}
.prog i.done{background:linear-gradient(90deg,var(--riverbed-hi),var(--whiskey))}
.prog i.on{background:linear-gradient(90deg,var(--crimson),var(--crimson-hi));box-shadow:0 0 8px rgba(237,27,46,.45)}
.stephead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.pill-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;
  background:linear-gradient(145deg,var(--crimson-hi),var(--crimson-lo));box-shadow:0 8px 20px rgba(237,27,46,.3),inset 0 1px 0 rgba(255,255,255,.35)}
/* Layer 2 — glass cards */
.glass,.script,.seg,.cli,.need,.score,.radar-wrap,.retire,.kpiwrap,.pillars div{
  background:linear-gradient(145deg,var(--g2),var(--g1));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:var(--edge),0 10px 30px rgba(69,85,96,.12);border:0}
.script{position:relative;border-radius:20px 20px 20px 6px;padding:14px 16px;margin:0 0 22px;overflow:hidden}
.script::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(206,155,116,.7),transparent)}
.script .lbl{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--whiskey)}
.script p{margin:8px 0 0;font-family:var(--serif);font-style:italic;font-size:16.5px;line-height:1.5;color:var(--ink)}
.why{margin-top:10px;font-size:13px;color:var(--ink-2)}
.why summary{cursor:pointer;font-weight:500;color:var(--ink-2);list-style:none;font-size:12.5px}
.why summary::-webkit-details-marker{display:none}
.why summary::before{content:"+ ";color:var(--whiskey);font-weight:700}
.why[open] summary::before{content:"– "}
.why p{margin:6px 0 0;font-family:var(--font);font-style:normal;font-size:13px;color:var(--ink-2)}
/* fields — Layer 3 */
.fields{display:grid;gap:18px}
.field label,.field .flabel{display:block;font-weight:500;font-size:13.5px;margin-bottom:8px;color:var(--ink)}
.field .hint{font-size:12px;color:var(--mute);margin-top:5px}
.inwrap{display:flex;align-items:center;border-radius:14px;background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px var(--line-2),0 2px 8px rgba(69,85,96,.06);transition:box-shadow .2s}
.inwrap:focus-within{box-shadow:inset 0 0 0 1px var(--whiskey),0 0 0 4px rgba(206,155,116,.16)}
.inwrap input{border:0;background:none;padding:13px 14px;flex:1;min-width:0;font-size:17px;outline:none;font-variant-numeric:tabular-nums;font-weight:500}
.inwrap input::-webkit-calendar-picker-indicator{opacity:.6}
.inwrap .unit{padding-right:14px;color:var(--mute);font-size:12px;font-weight:500;white-space:nowrap;letter-spacing:.02em}
textarea.ta{width:100%;border:0;border-radius:14px;background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px var(--line-2);padding:12px 14px;min-height:90px;resize:vertical;outline:none}
textarea.ta:focus{box-shadow:inset 0 0 0 1px var(--whiskey),0 0 0 4px rgba(206,155,116,.16)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:0;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px var(--line-2);border-radius:999px;padding:9px 15px;font-size:13.5px;cursor:pointer;font-weight:400;color:var(--ink-2);transition:all .15s}
.choice:hover{background:#fff}
.choice[aria-pressed="true"]{color:#fff;font-weight:600;background:linear-gradient(135deg,#D9A77E,var(--whiskey));box-shadow:0 6px 16px rgba(185,128,79,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--whiskey)}
.range output{min-width:52px;text-align:right;font-weight:600;font-size:17px}
:focus-visible{outline:2px solid var(--whiskey-hi);outline-offset:2px}
/* segments */
.segs{display:grid;gap:12px}
.seg{position:relative;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;text-align:left;border-radius:20px;padding:16px;cursor:pointer;color:var(--ink);transition:transform .15s}
.seg:hover{transform:translateY(-1px)}
.seg[aria-pressed="true"]{background:linear-gradient(145deg,rgba(255,236,238,.95),rgba(255,255,255,.85));box-shadow:inset 0 0 0 1.5px rgba(237,27,46,.55),0 14px 30px rgba(237,27,46,.16)}
.seg .tier{grid-row:span 3;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(206,155,116,.14);box-shadow:var(--edge);color:var(--whiskey)}
.seg[aria-pressed="true"] .tier{background:linear-gradient(145deg,var(--crimson-hi),var(--crimson-lo));color:#fff;box-shadow:0 6px 16px rgba(237,27,46,.45)}
.seg b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.seg .range-t{font-size:12.5px;color:var(--whiskey);font-weight:500}
.seg .focus{font-size:12.5px;color:var(--mute);font-weight:300}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none}
.bar-in{pointer-events:auto;max-width:460px;margin:0 auto;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg,rgba(255,255,255,.88),rgba(255,255,255,.6));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:1px solid var(--line)}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:600;cursor:pointer;font-size:14.5px;letter-spacing:.01em;transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn-primary{flex:1;color:#fff;background:linear-gradient(135deg,var(--crimson-hi) 0%,var(--crimson) 45%,var(--crimson-lo) 100%);box-shadow:0 10px 28px rgba(237,27,46,.38),inset 0 1px 0 rgba(255,255,255,.28)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn-ghost{background:rgba(255,255,255,.85);color:var(--ink);box-shadow:var(--edge)}
.btn-sm{padding:9px 13px;font-size:12.5px;border-radius:12px}
/* home hero */
.hero{border-radius:26px;padding:22px 20px 20px;margin-bottom:24px;position:relative;overflow:hidden;
  background:
    radial-gradient(420px 260px at 100% 0%, rgba(255,120,132,.55), transparent 65%),
    radial-gradient(380px 260px at 0% 100%, rgba(236,190,150,.60), transparent 70%),
    linear-gradient(150deg, rgba(255,255,255,.85), rgba(255,255,255,.55));
  box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.8),0 20px 44px rgba(200,80,90,.16);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.hero h1{font-size:27px}
.hero p{margin:0 0 18px;color:var(--ink-2);font-weight:300;font-size:14.5px}
.hero .btn-primary{flex:none}
.hero svg.deco{position:absolute;right:-40px;top:-40px;opacity:.14}
.hero .eyebrow{color:var(--crimson-lo)}
.list{display:grid;gap:10px;margin-top:12px}
.cli{display:grid;grid-template-columns:50px 1fr auto;gap:13px;align-items:center;border-radius:20px;padding:12px 14px 12px 12px;cursor:pointer;text-align:left;width:100%;color:var(--ink);transition:transform .15s}
.cli:hover{transform:translateY(-1px)}
.cli .sc{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:16px}
.cli b{font-weight:600}
.cli .meta{font-size:12px;color:var(--mute)}
.tag{display:inline-block;font-size:10.5px;font-weight:500;border-radius:999px;padding:3px 9px;background:var(--chip);color:var(--chip-ink);letter-spacing:.03em}
.tag.demo{background:rgba(255,255,255,.6);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.note{font-size:12px;color:var(--mute);margin-top:14px;font-weight:300}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.pillars div{border-radius:18px;padding:12px;font-size:12px;color:var(--crimson)}
.pillars div b{display:block;color:var(--ink);font-size:13px;font-weight:500;margin-top:6px}
/* report */
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.rhead h1{font-size:32px}
.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;border-radius:24px;padding:16px;margin:14px 0 14px;position:relative;overflow:hidden}
.score::before{content:"";position:absolute;width:240px;height:240px;left:-70px;top:-90px;background:radial-gradient(circle,rgba(255,110,122,.22),transparent 65%);pointer-events:none}
.ring{position:relative;width:96px;height:96px}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:300;letter-spacing:-.03em}
.ring small{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--mute);letter-spacing:.1em}
.tier-lbl{font-weight:500;font-size:20px;letter-spacing:-.01em}
.radar-wrap{border-radius:24px;padding:10px 8px 6px;margin-bottom:6px}
.radar-wrap svg{width:100%;height:auto;display:block}
.sec{margin:28px 0 12px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 8px}
.need{border-radius:20px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.need::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--sevc,var(--whiskey))}
.need.critical{--sevc:var(--crit)} .need.high{--sevc:var(--hi)} .need.medium{--sevc:var(--warn)}
.need .nh{display:flex;gap:12px;align-items:flex-start}
.need .rank{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:600;font-size:12.5px;color:#fff;background:linear-gradient(145deg,var(--riverbed-hi),var(--riverbed));box-shadow:0 4px 10px rgba(69,85,96,.25)}
.need h3{margin:0;font-size:15.5px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
.sev{font-size:10.5px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;letter-spacing:.03em}
.sev.critical{background:var(--crit-bg);color:var(--crit)}
.sev.high{background:var(--hi-bg);color:var(--hi)}
.sev.medium{background:var(--warn-bg);color:var(--warn)}
.sev.ok{background:var(--ok-bg);color:var(--ok)}
.need .find{margin:10px 0 0;font-size:13.5px;color:var(--ink-2);font-weight:300}
.need .act{margin:8px 0 0;font-size:14px}
.need .act b{font-weight:600;color:var(--crimson-lo)}
.sol{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sol span{font-size:11.5px;border-radius:10px;padding:4px 9px;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.pmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px}
.kpiwrap{border-radius:20px;padding:4px 14px;overflow-x:auto}
.kpis{width:100%;border-collapse:collapse;font-size:13.5px}
.kpis th,.kpis td{padding:11px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.kpis tr:last-child td{border-bottom:0}
.kpis th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:500}
.kpis td{font-weight:300}
.kpis td.v{text-align:right;font-weight:600;white-space:nowrap}
.kpis td.b{color:var(--mute);white-space:nowrap;text-align:right}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px}
.retire{border-radius:20px;padding:16px}
.bars{display:grid;gap:10px;margin-top:4px}
.bars .row{display:grid;grid-template-columns:84px 1fr auto;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.bars .row b{color:var(--ink);font-weight:600}
.bars .track{height:10px;border-radius:6px;background:rgba(69,85,96,.10);overflow:hidden}
.bars .fill{height:100%;border-radius:6px}
.disc{font-size:11px;color:var(--faint);margin-top:26px;line-height:1.55;font-weight:300}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:10;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:500;color:var(--ink);
  background:rgba(24,34,42,.88);color:#fff;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 12px 30px rgba(24,34,42,.25)}
.status{font-size:11.5px;color:var(--mute);display:flex;align-items:center;gap:7px;font-weight:300}
.status i{width:7px;height:7px;border-radius:50%;background:var(--mute);display:inline-block}
.status.live i{background:var(--ok)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:500px){body{padding-block:24px}.app{border-radius:30px;overflow:hidden;min-height:calc(100% - 48px);background:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 40px 90px rgba(69,85,96,.18)}.bar-in{border-radius:0 0 30px 30px}}

.choice.sug{box-shadow:inset 0 0 0 1.5px rgba(185,128,79,.55);background:rgba(206,155,116,.10);color:var(--chip-ink);border-style:dashed}
.choice em{font-style:normal;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;margin-left:6px;opacity:.75}
.inwrap input::placeholder{color:var(--faint);font-weight:400}
.range.is-sug output{color:var(--faint)}
.holdings{margin-top:6px;padding-top:18px;border-top:1px dashed var(--line-2)}
.universe{margin-top:12px;border-radius:16px;padding:10px 14px;background:rgba(255,255,255,.6);box-shadow:var(--edge)}
.universe summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--crimson-lo);list-style:none}
.universe summary::-webkit-details-marker{display:none}
.universe summary::before{content:"+ "}
.universe[open] summary::before{content:"– "}
.prod{padding:10px 0;border-top:1px solid var(--line)}
.prod:first-of-type{margin-top:8px}
.prod b{font-size:13.5px;font-weight:600}
.prod p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2);font-weight:300}
.prod small,.pp small{display:block;margin-top:4px;font-size:11.5px;color:var(--whiskey)}
.prods{display:grid;gap:8px;margin-top:12px}
.pp{border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px var(--line)}
.pp > div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pp b{font-size:13.5px;font-weight:600}
.pp p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2);font-weight:300}
.tag.have{background:var(--ok-bg);color:var(--ok)}
.assume{border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:13px;color:var(--chip-ink);background:rgba(206,155,116,.14);box-shadow:inset 0 0 0 1px rgba(185,128,79,.25)}
.linkbtn{border:0;background:none;color:var(--crimson-lo);font-weight:600;cursor:pointer;padding:0 2px;text-decoration:underline}

.pp{border-radius:16px;padding:12px;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px var(--line)}
.pph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ppt{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.toppick,.altpick{position:relative}
.altpick{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-2)}
.tp{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--crimson-hi),var(--crimson-lo));border-radius:6px;padding:2px 7px;margin-bottom:6px}
.tp.alt{background:rgba(69,85,96,.14);color:var(--ink-2)}
.pick{display:flex;gap:11px;align-items:flex-start}
.plogo{flex:none;border-radius:10px;background:#fff;box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(69,85,96,.12);object-fit:contain;padding:3px}
.plogo.mono{display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:.02em;padding:0}

function riskFunds(c,years,why){
  const r=c.risk||"balanced", seg=c.segment;
  if(years<5 || r==="conservative") return [["bondfund",why(L("Kỳ hạn ngắn hoặc khẩu vị thận trọng: ưu tiên thu nhập ổn định","Short horizon or cautious profile: steady income first"))]].concat(seg!=="mass"?[["balfund",why(L("Có thể thêm một phần quỹ cân bằng","Optionally add a balanced fund slice"))]]:[]);
  if(r==="balanced") return [["balfund",why(L("Khẩu vị cân bằng: cổ phiếu + trái phiếu trong một quỹ","Balanced profile: equities and bonds in one fund"))]].concat(seg==="mass"?[["sip",why(L("Góp định kỳ nhỏ vào quỹ cổ phiếu để tăng trưởng","Small regular equity contributions for growth"))]]:[["etf",why(L("ETF VN30 làm lõi cổ phiếu chi phí thấp","VN30 ETF as a low-cost equity core"))]]);
  return [["oef",why(L("Khẩu vị tăng trưởng, kỳ hạn dài: quỹ cổ phiếu hiệu suất cao","Growth profile, long horizon: top equity fund"))]].concat(seg==="mass"?[["sip",why(L("Đầu tư định kỳ để trung bình giá","Regular investing to average cost"))]]:[["etf",why(L("Bổ sung ETF VN30 làm lõi","Add a VN30 ETF core"))]]);

function deriveBS(o,raw){
  const seg=o.segment, full=seg==="aff"||seg==="hnw", D=BS_DEF[seg]||BS_DEF.massaff;
  const has=BS_KEYS.some(k=>raw[k]!=null&&raw[k]!=="");
  const b=k=>(raw[k]==null||raw[k]==="")? n0(D[k]) : n0(raw[k]);
  if(!has){ o.bs=null; return; }
  const bs={cash:b("a_cash"), bond:full?b("a_bond"):0, equity:full?b("a_equity"):0, gold:full?b("a_gold"):0, invest:full?0:b("a_invest"),
    re:full?b("a_re"):0, rent:full?b("a_reRent"):0, biz:full?b("a_biz"):0, home:b("a_home"), other:full?b("a_other"):0};
  const L_=full?["home","car","pers","card","biz","margin"]:["home","card"];
  bs.loans={}; L_.forEach(t=>bs.loans[t]={b:b("l_"+t+"_b"),p:b("l_"+t+"_p")});
  bs.debt=L_.reduce((a,t)=>a+bs.loans[t].b,0); bs.pay=L_.reduce((a,t)=>a+bs.loans[t].p,0);
  bs.mortgage=bs.loans.home.b;
  o.liquid=bs.cash; o.investable=bs.bond+bs.equity+bs.gold+bs.invest;
  o.debtTotal=bs.debt; o.debtPay=bs.pay; o.highInt=bs.loans.card.b+(full?bs.loans.pers.b:0);
  if(full){ const base=bs.cash+o.investable+bs.re+bs.biz+bs.other; o.concentration=base>0?Math.round(Math.max(bs.biz,bs.re)/base*100):0; }
  o.bs=bs;
}
function eff(c){ const d=DEFAULTS[c.segment]||DEFAULTS.massaff; const o=Object.assign({},c); const assumed=[];

  o.kidsE=kids.map(x=>({age:n0(x.age),cost:(x.cost!=null&&x.cost!=="")?n0(x.cost):EDU_COST[x.plan||"public"]}));
  deriveBS(o,c);
  o._assumed=assumed; return o; }

function fixFor(n,c){ const ce=eff(c), m=analyse(c).m; const I=m.I;
  return ({"borrow:1":x=>{x.highInt=0}, "borrow:1.5":x=>{x.onTime="always"}, "borrow:1.2":x=>{x.credit="fair"},
    "spend:2":x=>{const out=.8*I-n0(ce.debtPay); x.essential=r1(out*.7); x.lifestyle=r1(out*.3);},
    "save:3":x=>{x.liquid=Math.round(m.efTarget*(n0(ce.essential)+n0(ce.debtPay)))},
    "borrow:6":x=>{x.debtPay=r1(.3*I)},
    "protect:4":x=>{x.health=(c.segment==="aff"||c.segment==="hnw")?"premium":(ce.health==="none"?"basic":"premium")},
    "protect:5":x=>{x.lifeCover=Math.round(m.lifeNeed)},
  })[n.pillar+":"+n.order]; }
function upliftOf(n,c,base){ const f=fixFor(n,c); if(!f) return 0; const x=JSON.parse(JSON.stringify(c)); f(x); return Math.max(0,analyse(x).overall-base); }
function projectPlan(c,r){
  const ups = r.needs.map(n=>({n,u:upliftOf(n,c,r.overall)})).filter(o=>o.u>0).sort((a,b)=>b.u-a.u).slice(0,3);
  const x=JSON.parse(JSON.stringify(c)); ups.forEach(o=>fixFor(o.n,c)(x)); x.plan="yes";
  return {ups, score:analyse(x).overall};
}

function animateReveal(){
  const el=document.querySelector(".countup"); if(!el) return; const to=+el.dataset.to;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const mk=document.querySelector(".reveal .gtrack i"); if(mk){ const left=mk.style.left; mk.style.transition="none"; mk.style.left="2%"; requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ mk.style.transition="left 1.1s cubic-bezier(.2,.8,.2,1)"; mk.style.left=left; }); }); }
  const t0=performance.now(); const step=t=>{ const k=Math.min(1,(t-t0)/1100); el.textContent=Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step);

/* ---------------- analysis engine ---------------- */
const n0 = v => (v==null||v===""||isNaN(v))?0:Number(v);
const fmtM = v => { v = Math.round(n0(v)); if (Math.abs(v)>=1000){ const b=v/1000; return (LANG==="vi"? b.toLocaleString("vi-VN",{maximumFractionDigits:1})+" tỷ" : "VND "+b.toLocaleString("en-US",{maximumFractionDigits:1})+"bn"); } return LANG==="vi"? v.toLocaleString("vi-VN")+" tr" : "VND "+v.toLocaleString("en-US")+"m"; };
const pct = v => (isFinite(v)? Math.round(v*100):0)+"%";
const AGE_MULT = [[25,0],[30,1],[35,2],[40,3],[45,4],[50,6],[55,7],[60,8],[67,10]];
function ageMultiple(age){ if(age<=25) return 0; for(let i=1;i<AGE_MULT.length;i++){ const [a1,m1]=AGE_MULT[i-1],[a2,m2]=AGE_MULT[i]; if(age<=a2) return m1+(m2-m1)*(age-a1)/(a2-a1);} return 10; }
const SEVW = {critical:50, high:30, medium:15};
const REAL_R = {conservative:.02, balanced:.035, growth:.05};

function analyse(c0){
  const c = eff(c0);
  const seg = SEGMENTS[c.segment] || SEGMENTS.massaff;
  const upper = c.segment==="aff"||c.segment==="hnw";
  const I = n0(c.income)+n0(c.spouse)+n0(c.other);
  const exp = n0(c.essential)+n0(c.lifestyle);
  const pay = n0(c.debtPay);
  const save = c.monthlySave==null||c.monthlySave===""? Math.max(0,I-exp-pay) : n0(c.monthlySave);
  const needs = [];
  const add = (pillar,sev,order,o)=>needs.push(Object.assign({pillar,sev,order},o));
  const m = {I, exp, pay, save};
  if(!I){ return {needs:[], scores:{}, overall:0, m, empty:true}; }

  // SPEND
  m.spendRatio = exp/I;
  if(m.spendRatio>0.9) add("spend","critical",2,{t:L("Chi tiêu gần bằng hoặc vượt thu nhập","Spending close to or above income"),
     f:L(`Chi tiêu chiếm ${pct(m.spendRatio)} thu nhập ròng.`,`Spending takes ${pct(m.spendRatio)} of net income.`),
     a:L("Rà soát ngân sách theo 50/30/20, cắt giảm chi phong cách sống, tự động chuyển tiết kiệm ngay ngày nhận lương.","Rebuild the budget on 50/30/20, trim lifestyle costs and move savings automatically on payday."),
     s:[L("Ngân sách 50/30/20","50/30/20 budget"),L("Tài khoản tách mục tiêu","Goal-based sub-accounts"),L("Tiết kiệm tự động","Auto-save")]});
  else if(m.spendRatio>0.7 || (c.budget==="no"&&m.spendRatio>0.6)) add("spend","medium",2,{t:L("Cần tối ưu cơ cấu chi tiêu","Spending mix needs tightening"),
     f:L(`Chi tiêu ${pct(m.spendRatio)} thu nhập; chuẩn tham chiếu ≤ 70–80%.`,`Spending is ${pct(m.spendRatio)} of income; benchmark ≤ 70–80%.`),
     a:L("Theo dõi chi tiêu 3 tháng, đặt trần cho chi phong cách sống và ưu tiên 'trả cho mình trước'.","Track spending for 3 months, cap lifestyle costs and pay yourself first."),
     s:[L("Ngân sách 50/30/20","50/30/20 budget"),L("Tiết kiệm tự động","Auto-save")]});

  // SAVE
  m.saveRate = save/I;
  const efBase = n0(c.essential)+pay;
  m.efMonths = efBase? n0(c.liquid)/efBase : 99;
  m.efTarget = (EF_BASE[c.segment]||4) + ((c.stability==="variable"||c.work==="self"||c.work==="owner"||(n0(c.dependents)>0&&!n0(c.spouse)))?3:0);
  if(c.bs){ const idle=Math.max(0,c.bs.cash-m.efTarget*efBase); c.investable=n0(c.investable)+idle; c.pctCash=Math.round((idle+c.bs.gold)/Math.max(1,c.investable)*100); m.idle=idle; }
  const efSolutions = upper? [L("Quỹ thị trường tiền tệ","Money market fund"),L("Trái phiếu ngắn hạn","Short-duration bonds")] : [L("Tiết kiệm linh hoạt","Flexible savings"),L("Quỹ thị trường tiền tệ","Money market fund")];
  if(m.efMonths<1) add("save","critical",3,{t:L("Chưa có quỹ dự phòng","No emergency buffer"),
     f:L(`Tiền rút được ngay chỉ đủ ${m.efMonths.toFixed(1)} tháng chi phí; mục tiêu ${m.efTarget} tháng (${fmtM(efBase*m.efTarget)}).`,`Liquid cash covers only ${m.efMonths.toFixed(1)} months; target ${m.efTarget} months (${fmtM(efBase*m.efTarget)}).`),
     a:L("Ưu tiên xây quỹ dự phòng trước khi đầu tư rủi ro; góp đều mỗi tháng tới khi đủ mục tiêu.","Build the buffer before any risk investing; contribute monthly until it reaches target."), s:efSolutions});
  else if(m.efMonths<m.efTarget) add("save","high",3,{t:L("Quỹ dự phòng chưa đủ","Emergency fund below target"),
     f:L(`Đủ ${m.efMonths.toFixed(1)}/${m.efTarget} tháng. Thiếu ${fmtM(efBase*m.efTarget-n0(c.liquid))}.`,`Covers ${m.efMonths.toFixed(1)} of ${m.efTarget} months. Gap ${fmtM(efBase*m.efTarget-n0(c.liquid))}.`),
     a:L("Bổ sung phần thiếu trong 6–12 tháng, giữ ở kênh thanh khoản cao, không dùng cho đầu tư.","Close the gap over 6–12 months in a highly liquid account kept apart from investments."), s:efSolutions});
  if(m.saveRate<seg.saveT) add("save", m.saveRate<seg.saveT/2?"high":"medium",7,{t:L("Tỷ lệ tiết kiệm thấp hơn chuẩn phân khúc","Savings rate below segment benchmark"),
     f:L(`Đang tiết kiệm ${pct(m.saveRate)} thu nhập; chuẩn cho phân khúc ${L(seg.vi,seg.en)} là ≥ ${pct(seg.saveT)}.`,`Saving ${pct(m.saveRate)} of income; benchmark for ${L(seg.vi,seg.en)} is ≥ ${pct(seg.saveT)}.`),
     a:L(`Nâng dần lên ${fmtM(I*seg.saveT)}/tháng; tăng 1–2 điểm % mỗi lần tăng lương.`,`Step up to ${fmtM(I*seg.saveT)}/month; add 1–2 points with every pay rise.`),
     s:[L("Tiết kiệm tự động","Auto-save"),L("Đầu tư định kỳ (SIP)","Regular investment plan")]});

  // BORROW
  m.dsr = pay/I;
  if(n0(c.highInt)>0) add("borrow", n0(c.highInt)>I*2?"critical":"high",1,{t:L("Nợ lãi cao cần xử lý trước","Clear high-interest debt first"),
     f:L(`Dư nợ lãi cao ${fmtM(c.highInt)} (thẻ tín dụng / vay tiêu dùng thường 25–45%/năm).`,`High-interest balance of ${fmtM(c.highInt)} (cards and consumer loans often cost 25–45% a year).`),
     a:L("Trả nợ lãi cao nhất trước (avalanche) hoặc hợp nhất sang khoản vay lãi thấp hơn; không mở thêm hạn mức mới.","Pay the highest rate first (avalanche) or consolidate into a cheaper loan; open no new credit lines."),
     s:[L("Hợp nhất nợ","Debt consolidation"),L("Phương pháp avalanche","Avalanche method")]});
  if(c.onTime==="late"||c.onTime==="mostly") add("borrow", c.onTime==="late"?"high":"medium",1.5,{t:L("Thanh toán chưa đúng hạn","Late payments"),
     f:L("Trễ hạn làm phát sinh phí phạt và ảnh hưởng điểm tín dụng CIC.","Late payments add fees and hurt the CIC credit score."),
     a:L("Cài thanh toán tự động cho mọi hoá đơn và khoản vay; đặt ngày trả nợ ngay sau ngày nhận lương.","Automate every bill and loan payment; align due dates with payday."),
     s:[L("Thanh toán tự động","Auto-pay")]});
  if(c.credit==="bad") add("borrow","critical",1.2,{t:L("Có nợ xấu trên CIC","Bad debt on CIC"),
     f:L("Nợ xấu khiến gần như không thể vay mới với lãi hợp lý trong nhiều năm.","Bad debt blocks affordable new credit for years."),
     a:L("Tất toán khoản nợ xấu trước tiên, xin xác nhận hoàn tất và theo dõi CIC cập nhật.","Settle the bad debt first, get a clearance letter and track the CIC update."),
     s:[L("Tái cơ cấu nợ","Debt restructuring")]});
  if(m.dsr>0.4) add("borrow","critical",6,{t:L("Áp lực trả nợ vượt ngưỡng an toàn","Debt service above safe limit"),
     f:L(`Trả nợ chiếm ${pct(m.dsr)} thu nhập (DSR); ngưỡng an toàn ≤ 35%.`,`Repayments take ${pct(m.dsr)} of income (DSR); safe limit ≤ 35%.`),
     a:L("Tái cơ cấu kỳ hạn để giảm trả góp tháng, dừng vay mới cho tiêu dùng.","Extend or restructure terms to cut monthly payments; stop new consumer borrowing."),
     s:[L("Tái cơ cấu khoản vay","Loan restructuring"),L("Hợp nhất nợ","Debt consolidation")]});
  else if(m.dsr>0.3) add("borrow","medium",6,{t:L("DSR ở vùng cần theo dõi","Debt service needs watching"),
     f:L(`DSR ${pct(m.dsr)}; chuẩn ≤ 30–35%.`,`DSR ${pct(m.dsr)}; benchmark ≤ 30–35%.`),
     a:L("Tránh khoản vay mới cho tới khi DSR dưới 30%; ưu tiên trả trước khoản lãi cao.","Avoid new loans until DSR is under 30%; prepay the costliest loan."), s:[L("Trả nợ trước hạn có chọn lọc","Selective prepayment")]});

  // PROTECT
  const annualInc = n0(c.income)*12;
  const hasDeps = n0(c.dependents)>0 || c.family==="couple"||c.family==="kids"||c.family==="singleparent";
  { const ages=(c.kidsE||[]).map(k=>k.age); const yrs = ages.length? Math.max(0,22-Math.min(...ages)) : (n0(c.dependents)>0?10:(c.family==="couple"?5:0));
    const repl=Math.max(0,exp-n0(c.spouse))*12*yrs; m.eduTotal=(c.kidsE||[]).filter(k=>k.age<22).reduce((a,k)=>a+k.cost,0);
    m.lifeNeed = hasDeps? Math.max(0, repl+n0(c.debtTotal)+m.eduTotal-n0(c.liquid)-n0(c.investable)) : n0(c.debtTotal); m.lifeYears=yrs; }
  m.lifeGap = Math.max(0, m.lifeNeed-n0(c.lifeCover));
  m.ciNeed = annualInc*3; m.ciGap = Math.max(0,m.ciNeed-n0(c.ciCover));
  if(c.health==="none") add("protect", upper?"high":"critical",4,{t:L("Chưa có bảo hiểm sức khoẻ bổ sung","No private health cover"),
     f:L("Chi phí y tế lớn có thể làm cạn quỹ dự phòng và kế hoạch đầu tư.","A major medical bill can wipe out savings and derail the plan."),
     a:L("Bổ sung bảo hiểm sức khoẻ cho cả gia đình, ưu tiên nội trú và bệnh hiểm nghèo.","Add family health cover, prioritising inpatient and serious illness."),
     s:upper?[L("Sức khoẻ cao cấp / quốc tế","Premium / international health")]:[L("Sức khoẻ cơ bản","Basic health plan"),L("Bảo hiểm vi mô","Micro-insurance")]});
  else if(c.health==="basic" && upper) add("protect","medium",4,{t:L("Nâng cấp bảo hiểm sức khoẻ","Upgrade health cover"),
     f:L("Gói cơ bản chưa tương xứng với mức sống và kỳ vọng điều trị của phân khúc.","A basic plan falls short of this segment's lifestyle and treatment expectations."),
     a:L("Cân nhắc gói toàn diện, phạm vi quốc tế, hạn mức cao.","Consider a comprehensive plan with international cover and higher limits."), s:[L("Sức khoẻ quốc tế","International health")]});
  if(m.lifeGap>0 && hasDeps) add("protect", n0(c.lifeCover)===0?"critical":(m.lifeGap>m.lifeNeed*.5?"high":"medium"),5,{t:L("Thiếu hụt bảo vệ thu nhập (nhân thọ)","Life cover gap"),
     f:L(`Nhu cầu ≈ ${fmtM(m.lifeNeed)} (10× thu nhập năm + dư nợ); hiện có ${fmtM(c.lifeCover)}. Thiếu ${fmtM(m.lifeGap)}.`,`Need ≈ ${fmtM(m.lifeNeed)} (10× annual income + debts); in place ${fmtM(c.lifeCover)}. Gap ${fmtM(m.lifeGap)}.`),
     a:L("Bổ sung mệnh giá bảo vệ để thay thế thu nhập và trả hết nợ nếu rủi ro xảy ra.","Add cover so income is replaced and debts are cleared if the worst happens."),
     s:upper?[L("Tử kỳ + liên kết chung","Term + universal life"),L("Cấu trúc thừa kế","Estate-linked cover")]:[L("Bảo hiểm tử kỳ","Term life"),L("Rider thu nhập","Income benefit rider")]});
  if(m.ciGap>0 && annualInc>0 && c.work!=="retired") add("protect", n0(c.ciCover)===0?"high":"medium",5.5,{t:L("Thiếu bảo vệ bệnh hiểm nghèo","Critical illness gap"),
     f:L(`Chuẩn ≈ 3× thu nhập năm (${fmtM(m.ciNeed)}); hiện có ${fmtM(c.ciCover)}.`,`Benchmark ≈ 3× annual income (${fmtM(m.ciNeed)}); in place ${fmtM(c.ciCover)}.`),
     a:L("Bổ sung quyền lợi bệnh hiểm nghèo để bù thu nhập trong thời gian điều trị.","Add critical illness cover to replace income during treatment."), s:[L("Rider bệnh hiểm nghèo","Critical illness rider")]});
  if(c.will==="no" && (upper || n0(c.dependents)>0)) add("protect", c.segment==="hnw"?"high":"medium",9,{t:L("Chưa có kế hoạch thừa kế","No estate plan"),
     f:L("Chưa có di chúc hoặc uỷ quyền; rủi ro tranh chấp và chậm trễ chuyển giao tài sản.","No will or power of attorney; risk of disputes and delays in passing on assets."),
     a:L("Lập di chúc, chỉ định người thụ hưởng, cân nhắc cấu trúc thừa kế với luật sư.","Draft a will, name beneficiaries and review succession structures with a lawyer."),
     s:c.segment==="hnw"?[L("Di chúc & uỷ quyền","Will & power of attorney"),L("Uỷ thác / quỹ gia đình","Trust / family office")]:[L("Di chúc","Will"),L("Chỉ định người thụ hưởng","Beneficiary nomination")]});
  if(c.work==="owner" && upper && c.keyPerson==="no") add("protect","high",8.5,{t:L("Rủi ro doanh nghiệp chưa được tách bạch","Business risk not ring-fenced"),
     f:L("Tài sản gia đình phụ thuộc vào doanh nghiệp nhưng chưa có bảo hiểm người chủ chốt hay kế hoạch kế nhiệm.","Family wealth depends on the business, with no key-person cover or succession plan."),
     a:L("Bảo hiểm người chủ chốt, thoả thuận mua bán cổ phần, tách tài sản cá nhân – doanh nghiệp.","Key-person cover, buy-sell agreement and separation of personal and business assets."),
     s:[L("Bảo hiểm người chủ chốt","Key-person insurance"),L("Kế hoạch kế nhiệm","Succession plan")]});

  // INVEST
  m.multiple = n0(c.investable)/(I*12);
  m.multBench = ageMultiple(n0(c.age));
  const years = n0(c.retireAge)-n0(c.age);
  const rNew = realOf(mixNom(c.risk));
  const bs=c.bs; const nowNom = bs? ((bs.bond*NOM.bond+bs.equity*NOM.eq+bs.gold*NOM.gold+(m.idle||0)*NOM.dep+bs.invest*mixNom(c.risk))/Math.max(1,n0(c.investable))) : (n0(c.pctCash)/100*(NOM.dep+NOM.gold)/2+(1-n0(c.pctCash)/100)*mixNom(c.risk));
  const rNow = realOf(nowNom);
  m.retireYears = years;
  if(years>0 && c.work!=="retired"){
    const tier=RET_PCT[c.segment]||RET_PCT.massaff; m.retPct=tier[LIFEI[c.lifestyle]??1]/100;
    const by=n0(c.bhxhYears); m.pension=(c.segment==="mass"||c.segment==="massaff")&&by>=15? Math.min(.75,.45+.02*Math.max(0,by-20))*Math.min(46.8,.6*n0(c.income)) : 0;
    m.rentInc = bs? bs.rent : 0;
    m.retSpend=exp*m.retPct; const gapM=Math.max(0,m.retSpend-m.pension-m.rentInc); m.corpus=gapM*12/0.04;
    const fvA = n0(c.investable)*Math.pow(1+rNow,years);
    const fvC = rNew>0? save*12*((Math.pow(1+rNew,years)-1)/rNew) : save*12*years;
    m.projected = fvA+fvC; m.retGap = Math.max(0,m.corpus-m.projected);
    m.reqMonthly = m.retGap>0? m.retGap*rNew/(Math.pow(1+rNew,years)-1)/12 : 0;
    if(m.retGap>0){ const ratio=m.projected/Math.max(1,m.corpus);
      add("invest", ratio<.4?"high":"medium",7,{t:"",f:"",a:"",s:[]}); }
  }
  if((c.kidsE||[]).some(k=>k.age<18)){ const kids=c.kidsE.filter(k=>k.age<18); m.eduMonthly=kids.reduce((a,k)=>{const n=Math.max(1,18-k.age); const rr=realOf(n<5?NOM.bond:mixNom(c.risk)); return a+k.cost*rr/(Math.pow(1+rr,n)-1)/12;},0); m.eduMinYears=Math.min(...kids.map(k=>Math.max(1,18-k.age))); m.eduKids=kids.length; m.eduCost=kids.reduce((a,k)=>a+k.cost,0);
    if(!(n0(c.investable)>=m.eduCost*1.5 && !m.retGap)) add("invest", m.eduMinYears<=5?"high":"medium",7.2,{t:"",f:"",a:"",s:[]}); }
  if(n0(c.pctCash)>60 && years>5 && n0(c.investable)>0) add("invest","medium",8,{t:L("Tài sản tập trung vào tiền gửi & vàng","Too much in deposits and gold"),
     f:L(`${c.pctCash}% tài sản đầu tư ở tiền gửi/vàng, trong khi còn ${years} năm tới hưu trí; lợi suất thực thấp.`,`${c.pctCash}% sits in deposits or gold with ${years} years to retirement; low real returns.`),
     a:L(`Chuyển dần sang danh mục đa tài sản theo khẩu vị ${riskName(c.risk)}; giải ngân từng phần (DCA) 6–12 tháng.`,`Shift gradually into a multi-asset mix matched to a ${riskName(c.risk)} profile; phase in over 6–12 months (DCA).`),
     s:[L("Quỹ cân bằng","Balanced fund"),L("Quỹ trái phiếu","Bond fund"),L("DCA","Dollar-cost averaging")]});
  if(upper && n0(c.concentration)>=40) add("invest", n0(c.concentration)>=60?"high":"medium",8.2,{t:L("Rủi ro tập trung tài sản","Concentration risk"),
     f:L(`Một tài sản chiếm ${c.concentration}% tổng tài sản; chuẩn quản trị rủi ro ≤ 20–25%.`,`One holding is ${c.concentration}% of wealth; risk guideline ≤ 20–25%.`),
     a:L("Giảm tập trung theo lộ trình, cân nhắc vay cầm cố danh mục thay vì bán, phòng hộ khi phù hợp.","Reduce concentration on a schedule; consider portfolio-backed lending instead of selling, and hedging where suitable."),
     s:[L("Đa dạng hoá theo lộ trình","Staged diversification"),L("Vay cầm cố danh mục","Portfolio-backed lending")]});
  if(m.multiple < m.multBench*.6 && n0(c.age)>=30 && !needs.some(x=>x.order===7&&x.pillar==="invest")) add("invest","medium",7.5,{t:L("Tài sản đầu tư thấp so với độ tuổi","Investable assets low for age"),
     f:L(`Đang có ${m.multiple.toFixed(1)}× thu nhập năm; chuẩn tham chiếu ở tuổi ${c.age} ≈ ${m.multBench.toFixed(1)}×.`,`Holds ${m.multiple.toFixed(1)}× annual income; benchmark at age ${c.age} ≈ ${m.multBench.toFixed(1)}×.`),
     a:L("Thiết lập kế hoạch đầu tư định kỳ gắn với từng mục tiêu.","Set up regular investing linked to each goal."), s:[L("Đầu tư định kỳ (SIP)","Regular investment plan")]});

  // EARN
  if(n0(c.dependents)>0 && !n0(c.spouse) && !n0(c.other)) add("earn","medium",10,{t:L("Phụ thuộc vào một nguồn thu nhập","Single income supports the family"),
     f:L(`Một nguồn thu nhập nuôi ${c.dependents} người phụ thuộc.`,`One income supports ${c.dependents} dependant(s).`),
     a:L("Bảo vệ thu nhập bằng bảo hiểm, xây nguồn thu thụ động (cho thuê, cổ tức) theo thời gian.","Insure the income and build passive income (rent, dividends) over time."), s:[L("Rider thu nhập","Income benefit rider"),L("Danh mục cổ tức","Dividend portfolio")]});
  if(c.stability==="variable") add("earn","medium",10.5,{t:L("Thu nhập biến động","Variable income"),
     f:L("Thu nhập thay đổi theo tháng làm tăng rủi ro dòng tiền.","Month-to-month swings raise cash-flow risk."),
     a:L("Chi tiêu theo 'mức lương nền' thấp nhất, phần vượt đưa vào quỹ dự phòng và đầu tư.","Budget off a baseline 'salary' and sweep the surplus into savings and investments."), s:[L("Lương nền tự trả","Self-paid baseline salary")]});
  if(upper && !n0(c.other)) add("earn","medium",10.8,{t:L("Chưa có thu nhập thụ động","No passive income yet"),
     f:L("Toàn bộ thu nhập đến từ công việc chủ động.","All income comes from active work."),
     a:L("Xây danh mục tạo dòng tiền (cổ tức, trái phiếu, cho thuê) hướng tới độc lập tài chính.","Build income-producing assets (dividends, bonds, rentals) towards financial independence."), s:[L("Danh mục thu nhập","Income portfolio")]});

  // scores
  const scores = {}; PILLARS.forEach(p=>{ let s=100; needs.filter(x=>x.pillar===p.k).forEach(x=>s-=SEVW[x.sev]||0); scores[p.k]=Math.max(5,s); });
  const fh = finHealth(c,m);
  const overall = fh.score;
  const sevRank = {critical:0,high:1,medium:2};
  needs.sort((a,b)=> (sevRank[a.sev]-sevRank[b.sev]) || (a.order-b.order));
  needs.forEach(n=>shortCopy(n,c,m,seg));
  needs.forEach(n=>n.products=productsFor(n,c,needs,m));
  return {needs, scores, overall, fh, m, assumed:c._assumed||[], ce:c};
}

/* FinHealth Score – 8 indicators (Financial Health Network framework: Spend, Save, Borrow, Plan) */
function band(v,cuts){ for(const [t,sc] of cuts){ if(v>=t) return sc; } return 0; }
function finHealth(c,m){
  const I=m.I, out=(m.exp+m.pay)/I;
  const hasDeps = n0(c.dependents)>0 || ["couple","kids","singleparent"].includes(c.family);
  const lifeRatio = hasDeps? Math.min(1,n0(c.lifeCover)/Math.max(1,m.lifeNeed)) : 1;
  const hp = c.health==="premium"?100:c.health==="basic"?60:0;
  const nw = c.bs? (c.bs.cash+c.bs.bond+c.bs.equity+c.bs.gold+c.bs.invest+c.bs.re+c.bs.biz+c.bs.other-(c.bs.debt-c.bs.mortgage)) : n0(c.liquid)+n0(c.investable)-n0(c.highInt);
  const expected = n0(c.age)*I*12/10;
  const wi = expected>0? nw/expected : 0;
  const freedom = m.exp>0? (n0(c.other)+n0(c.investable)*.04/12)/m.exp : 0;
  const multRatio = m.multBench>0? m.multiple/m.multBench : (m.saveRate>=.1?1:.5);
  const ind = [
    {k:"spend", p:"spend", vi:"Chi tiêu thấp hơn thu nhập", en:"Spends less than income", v:band(-out,[[-.8,100],[-.9,75],[-1,50],[-1.1,25]]), d:pct(out)+L(" thu nhập đã chi"," of income spent")},
    {k:"bills", p:"spend", vi:"Thanh toán đúng hạn", en:"Pays bills on time", v:c.onTime==="always"?100:c.onTime==="mostly"?60:10, d:c.onTime==="always"?L("Luôn đúng hạn","Always"):c.onTime==="mostly"?L("Thỉnh thoảng trễ","Sometimes late"):L("Thường trễ","Often late")},
    {k:"liquid", p:"save", vi:"Đủ tiền dự phòng", en:"Enough liquid savings", v:band(m.efMonths,[[6,100],[3,75],[1,50],[.5,25]]), d:(m.efMonths>=99?"–":m.efMonths.toFixed(1))+L(" tháng chi phí"," months of costs")},
    {k:"longterm", p:"invest", vi:"Tích luỹ dài hạn đủ", en:"Enough long-term savings", v:band(multRatio,[[1,100],[.75,75],[.5,50],[.25,25]]), d:m.multiple.toFixed(1)+"× / "+m.multBench.toFixed(1)+"× "+L("chuẩn tuổi","age benchmark")},
    {k:"debt", p:"borrow", vi:"Nợ trong tầm kiểm soát", en:"Manageable debt", v:Math.min(n0(c.highInt)>0?50:100, band(-m.dsr,[[-.2,100],[-.35,75],[-.45,50],[-.6,25]])), d:"DSR "+pct(m.dsr)},
    {k:"credit", p:"borrow", vi:"Lịch sử tín dụng tốt", en:"Good credit history", v:{good:100,fair:50,bad:10,unknown:50}[c.credit]||50, d:{good:L("Tốt","Good"),fair:L("Nợ nhóm 2","Watch-list"),bad:L("Nợ xấu","Bad debt"),unknown:L("Chưa rõ","Unknown")}[c.credit]||"–"},
    {k:"insure", p:"protect", vi:"Bảo hiểm phù hợp", en:"Appropriate insurance", v:Math.round((hp+lifeRatio*100)/2), d:L("Nhân thọ ","Life ")+pct(lifeRatio)+L(" nhu cầu"," of need")},
    {k:"plan", p:"plan", vi:"Có kế hoạch tài chính", en:"Plans ahead", v:c.plan==="yes"?100:c.plan==="partly"?55:15, d:c.plan==="yes"?L("Có kế hoạch rõ","Clear plan"):c.plan==="partly"?L("Có ý tưởng","Rough idea"):L("Chưa có","None yet")},
  ];
  const score = Math.round(ind.reduce((a,x)=>a+x.v,0)/ind.length);
  return {score, ind, nw, expected, wi, freedom};
}
function wealthBand(w){ return w>=2?{k:"ok",vi:"Tích luỹ xuất sắc",en:"Prodigious accumulator"}:w>=1?{k:"ok",vi:"Đúng nhịp",en:"On pace"}:w>=.5?{k:"medium",vi:"Dưới chuẩn",en:"Below pace"}:{k:"critical",vi:"Tích luỹ thấp",en:"Under-accumulator"}; }
function freedomBand(f){ return f>=1?{k:"ok",vi:"Độc lập tài chính",en:"Financially independent"}:f>=.5?{k:"ok",vi:"Bán độc lập",en:"Semi-independent"}:f>=.2?{k:"medium",vi:"Đang xây nền",en:"Building"}:{k:"critical",vi:"Phụ thuộc thu nhập chủ động",en:"Depends on active income"}; }
function gaugeHTML(v){ const t=tierOf(v); return `<div class="gauge"><div class="gtrack"><span style="flex:40" class="z1"></span><span style="flex:40" class="z2"></span><span style="flex:20" class="z3"></span><i style="left:${Math.min(98,Math.max(2,v))}%"></i></div>

    borrow:[L("Tỷ lệ trả nợ (DSR)","Debt service (DSR)"), pct(m.dsr), L("Chuẩn ≤ 35%; nợ lãi cao cần xử lý trước.","Keep ≤ 35%; clear high-interest debt first."), L("“Khoản vay nào đang làm anh/chị bận tâm nhất?”","“Which loan worries you the most?”"), m.dsr<=.35 && !n0(ce.highInt)],
    invest:[L("Chỉ số tích luỹ tài sản","Wealth accumulation index"), fh.wi.toFixed(2)+"×", L(`${L(wealthBand(fh.wi).vi,wealthBand(fh.wi).en)} · chuẩn = tuổi × thu nhập năm ÷ 10.`,`${wealthBand(fh.wi).en} · benchmark = age × annual income ÷ 10.`), L("“Anh/chị hình dung cuộc sống lúc nghỉ hưu ra sao, cần khoảng bao nhiêu mỗi tháng?”","“What does retirement look like for you, and what would it cost each month?”"), fh.wi>=1],
    protect:[L("Mức bảo vệ nhân thọ","Life cover vs need"), pct(Math.min(9.99,n0(ce.lifeCover)/Math.max(1,m.lifeNeed))), L(`Nhu cầu ≈ ${fmtM(m.lifeNeed)} (10× thu nhập năm + dư nợ).`,`Need ≈ ${fmtM(m.lifeNeed)} (10× annual income + debts).`), L("“Nếu chuyện không may xảy ra, anh/chị muốn các con vẫn giữ được điều gì?”","“If the worst happened, what would you want the children to keep?”"), m.lifeGap<=0],
  }[st.pillar];
  if(!I) return "";
  return `<div class="insight ${I[4]?"good":"warn"}"><div class="ih"><span class="eyebrow">${L("Nhận định nhanh","Quick read")}</span><span class="sev ${I[4]?"ok":"medium"}">${I[4]?L("Đạt chuẩn","On track"):L("Cần trao đổi","Discuss")}</span></div>
    <div class="im"><span>${I[0]}</span><b class="num">${I[1]}</b></div><p>${I[2]}</p><div class="talk">${I.chat||""}<i>${L("Câu hỏi đào sâu","Follow-up question")}</i> ${I[3]}</div></div>`;
}

  }[k];
  if(C){ n.t=C[0]; n.f=C[1]; n.a=C[2]; }

async function saveClient(){
  const c=S.c; if(c.demo){ toast(L("Đây là hồ sơ ví dụ, hãy tạo tư vấn mới để lưu","This is the example client. Start a new session to save.")); return; }
  c.updatedAt=new Date().toISOString();
  const r=analyse(c); c.score=r.overall;
  if(!c.id) c.id="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const body=JSON.parse(JSON.stringify(c)); delete body.id;
  if(COLL){
    try{ await COLL.doc(c.id).set(body); toast(L("Đã lưu hồ sơ","Client saved")); }
    catch(e){ toast(L("Không lưu được: ","Could not save: ")+(e&&e.code||"error")); }
  } else {
    const i=S.clients.findIndex(x=>x.id===c.id); if(i>=0) S.clients[i]=Object.assign({},c); else S.clients.unshift(Object.assign({},c));
    try{ localStorage.setItem("ac-clients",JSON.stringify(S.clients)); }catch(_){ }
    toast(L("Đã lưu trên thiết bị này","Saved on this device"));
  }
}
async function deleteClient(){
  const c=S.c; if(!c||!c.id||c.demo) return;
  if(COLL){ try{ await COLL.doc(c.id).delete(); }catch(e){ toast(L("Không xoá được","Could not delete")); return; } }
  else { S.clients=S.clients.filter(x=>x.id!==c.id); try{ localStorage.setItem("ac-clients",JSON.stringify(S.clients)); }catch(_){ } }
  toast(L("Đã xoá hồ sơ","Client deleted")); S.view="home"; S.c=null; S.confirmDel=false; render();
}

function radarSVG(scores){
  const W=360,H=280,cx=180,cy=140,R=92; const N=PILLARS.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N; return [cx+r*Math.cos(a), cy+r*Math.sin(a)];};
  const ring=f=>PILLARS.map((_,i)=>pt(i,R*f).map(x=>x.toFixed(1)).join(",")).join(" ");
  const poly=PILLARS.map((p,i)=>pt(i,R*scores[p.k]/100).map(x=>x.toFixed(1)).join(",")).join(" ");
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L("Biểu đồ 6 trụ cột","Six-pillar chart")}"><defs><radialGradient id="rdG" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#FF4658" stop-opacity=".40"/><stop offset="1" stop-color="#CE9B74" stop-opacity=".22"/></radialGradient></defs>`;
  [.25,.5,.75,1].forEach(f=>s+=`<polygon points="${ring(f)}" fill="none" stroke="var(--line)" stroke-width="1"/>`);
  s+=`<polygon points="${ring(.8)}" fill="none" stroke="var(--whiskey)" stroke-width="1.2" stroke-dasharray="4 4"/>`;
  PILLARS.forEach((_,i)=>{const [x,y]=pt(i,R); s+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`;});
  s+=`<polygon points="${poly}" fill="url(#rdG)" stroke="#FF4658" stroke-width="1.8" stroke-linejoin="round" style="filter:drop-shadow(0 4px 8px rgba(237,27,46,.25))"/>`;
  PILLARS.forEach((p,i)=>{const [x,y]=pt(i,R*scores[p.k]/100); s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#fff" stroke="#FF4658" stroke-width="2"/>`;
    const [lx,ly]=pt(i,R+22); const anchor=Math.abs(lx-cx)<8?"middle":lx>cx?"start":"end";
    s+=`<text x="${lx.toFixed(1)}" y="${(ly-2).toFixed(1)}" text-anchor="${anchor}" font-size="11.5" font-weight="600" fill="#18222A" letter-spacing=".3" font-family="Be Vietnam Pro, system-ui, sans-serif">${esc(L(p.vi,p.en))}</text>
          <text x="${lx.toFixed(1)}" y="${(ly+12).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="${sevColor(scores[p.k]>=80?"ok":scores[p.k]>=55?"medium":scores[p.k]>=35?"high":"critical")}" font-weight="700" font-family="Be Vietnam Pro, system-ui, sans-serif">${scores[p.k]}</text>`;});
  s+=`<text x="${W-6}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--mute)" font-family="Be Vietnam Pro, system-ui, sans-serif">- - ${L("Ngưỡng khoẻ mạnh 80","Healthy threshold 80")}</text></svg>`;
  return s;
}
function ringSVG(v,color){ const r=40,c=2*Math.PI*r; return `<svg width="96" height="96" viewBox="0 0 92 92"><defs><linearGradient id="rgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${color}"/><stop offset="1" stop-color="var(--whiskey-hi)"/></linearGradient></defs><circle cx="46" cy="46" r="${r}" fill="none" stroke="rgba(69,85,96,.10)" stroke-width="7"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="url(#rgG)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(c*v/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 46 46)" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))"/></svg>`; }

  return `<main>
  <div class="rhead"><div><div class="eyebrow">${L("Kế hoạch tài chính","Financial plan")}</div><h1 style="margin:2px 0 4px">${esc(c.name||L("Khách hàng","Client"))}</h1>
   <div class="pmeta"><span class="tag">${esc(L(seg.vi,seg.en))}</span>${ce.age?`<span class="tag">${ce.age} ${L("tuổi","yrs")}</span>`:""}${c.demo?`<span class="tag demo">${L("Ví dụ","Example")}</span>`:""}</div></div></div>
  <section class="bmi">
   <div class="bmitop"><div><div class="eyebrow">${L("BMI tài chính · FinHealth Score","Financial BMI · FinHealth Score")}</div>
     <div class="bmiv"><span class="num" style="color:${sevColor(t.k)}">${r.overall}</span><small>/100</small><em style="color:${sevColor(t.k)}">${L(t.vi,t.en)}</em></div></div></div>
   ${gaugeHTML(r.overall)}
   <div class="note" style="margin-top:8px">${L(`${r.needs.length} điểm cần cải thiện`,`${r.needs.length} areas to improve`)}${goalsTxt?" · "+L("Mục tiêu: ","Goals: ")+esc(goalsTxt):""}</div>
  </section>
  ${r.assumed.length&&!c.demo?`<div class="assume">${L(`${r.assumed.length} số liệu đang là giả định.`,`${r.assumed.length} inputs are assumptions.`)} <button class="linkbtn" data-a="edit">${L("Rà soát","Review")}</button></div>`:""}

  ${pj.score>r.overall?`<section class="plan90"><div class="eyebrow">${L("Kế hoạch 90 ngày","90-day plan")}</div>
   <div class="p90v"><span class="num">${r.overall}</span><i>→</i><b class="num">${pj.score}</b><em>${L(tierOf(pj.score).vi,tierOf(pj.score).en)}</em></div>
   <ol>${pj.ups.map(o=>`<li><span>${esc(o.n.t)}</span><b class="num">+${o.u}</b></li>`).join("")}<li><span>${L("Cam kết kế hoạch hôm nay","Commit to the plan today")}</span><b class="num">✓</b></li></ol></section>`:""}
  <div class="sec"><h2>${L("Lộ trình hành động","Action plan")}</h2><span class="eyebrow">${L("Theo thứ tự ưu tiên","In priority order")}</span></div>
  ${needs}
  <div class="sec"><h2>${L("Chẩn đoán chi tiết","Full diagnosis")}</h2></div>
  ${bsHTML()}
  <div class="vitals">
   <div class="vital"><span class="eyebrow">${L("Tích luỹ tài sản","Wealth index")}</span><b class="num" style="color:${sevColor(wealthBand(r.fh.wi).k)}">${r.fh.wi.toFixed(2)}×</b><span>${L(wealthBand(r.fh.wi).vi,wealthBand(r.fh.wi).en)}</span></div>
   <div class="vital"><span class="eyebrow">${L("Tự do tài chính","Freedom ratio")}</span><b class="num" style="color:${sevColor(freedomBand(r.fh.freedom).k)}">${pct(r.fh.freedom)}</b><span>${L(freedomBand(r.fh.freedom).vi,freedomBand(r.fh.freedom).en)}</span></div>
   <div class="vital"><span class="eyebrow">${L("Sức chịu đựng","Runway")}</span><b class="num" style="color:${sevColor(m.efMonths>=m.efTarget?"ok":m.efMonths>=1?"medium":"critical")}">${m.efMonths>=99?"–":m.efMonths.toFixed(1)}</b><span>${L("tháng không thu nhập","months without income")}</span><small>${L("Chuẩn","Target")} ${m.efTarget} ${L("tháng","months")}</small></div>
  </div>
  <div class="sec"><h2>${L("8 chỉ số thành phần","8 components")}</h2><span class="eyebrow">Spend · Save · Borrow · Plan</span></div>
  <div class="comps">${r.fh.ind.map(x=>`<div class="comp"><div class="ch"><span>${esc(L(x.vi,x.en))}</span><b class="num" style="color:${sevColor(x.v>=80?"ok":x.v>=50?"medium":x.v>=25?"high":"critical")}">${x.v}</b></div><div class="cbar"><i style="width:${Math.max(3,x.v)}%;background:${sevColor(x.v>=80?"ok":x.v>=50?"medium":x.v>=25?"high":"critical")}"></i></div><small>${esc(x.d)}</small></div>`).join("")}</div>
  <div class="sec"><h2>${L("6 trụ cột","Six pillars")}</h2></div>
  <div class="radar-wrap">${radarSVG(r.scores)}</div>
  <div class="sec"><h2>${L("Chỉ số chính","Key ratios")}</h2></div>
  <div class="kpiwrap"><table class="kpis"><thead><tr><th>${L("Chỉ số","Ratio")}</th><th style="text-align:right">${L("Hiện tại","Now")}</th><th style="text-align:right">${L("Chuẩn","Benchmark")}</th></tr></thead><tbody>
   ${row(L("Chi tiêu / thu nhập","Spending / income"),pct(m.spendRatio),"≤ 70%",m.spendRatio<=.7)}
   ${row(L("Tỷ lệ tiết kiệm","Savings rate"),pct(m.saveRate),"≥ "+pct(seg.saveT),m.saveRate>=seg.saveT)}
   ${row(L("Quỹ dự phòng","Emergency fund"),m.efMonths>=99?"–":m.efMonths.toFixed(1)+" "+L("th","mo"),m.efTarget+" "+L("tháng","months"),m.efMonths>=m.efTarget)}
   ${row("DSR",pct(m.dsr),"≤ 35%",m.dsr<=.35)}
   ${row(L("Tài sản đầu tư / thu nhập năm","Investable / annual income"),m.multiple.toFixed(1)+"×","≈ "+m.multBench.toFixed(1)+"×",m.multiple>=m.multBench*.6)}
   ${row(L("Bảo hiểm nhân thọ","Life cover"),fmtM(ce.lifeCover),fmtM(m.lifeNeed),m.lifeGap<=0)}
  </tbody></table></div>
  ${retire}
  <div class="sec"><h2>${L("Ghi chú & hẹn gặp lại","Notes & follow-up")}</h2></div>
  <div class="fields"><div class="field"><label for="f-followUp">${L("Ngày hẹn rà soát","Review date")}</label><div class="inwrap"><input id="f-followUp" type="date" data-k="followUp" value="${esc(c.followUp||"")}"></div></div>
   <div class="field"><label for="f-notes">${L("Ghi chú buổi tư vấn","Session notes")}</label><textarea id="f-notes" class="ta" data-k="notes">${esc(c.notes||"")}</textarea></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn btn-ghost btn-sm" data-a="copy">${L("Sao chép tóm tắt","Copy summary")}</button><button class="btn btn-ghost btn-sm" data-a="edit">${L("Sửa thông tin","Edit answers")}</button>
   ${c.id&&!c.demo? (S.confirmDel? `<span class="confirm">${L("Xoá hồ sơ này?","Delete this client?")} <button class="btn btn-sm" style="background:var(--crit);color:#fff" data-a="del-yes">${L("Xoá","Delete")}</button><button class="btn btn-ghost btn-sm" data-a="del-no">${L("Huỷ","Cancel")}</button></span>` : `<button class="btn btn-ghost btn-sm" data-a="del">${L("Xoá hồ sơ","Delete client")}</button>`):""}</div>
  <p class="disc">${L("Kết quả tham khảo từ thông tin khách cung cấp. Kiểm tra mức độ phù hợp trước khi tư vấn sản phẩm.","Indicative, based on client inputs. Run suitability checks before recommending products.")}</p>
  </main>`;
}

function renderBar(){
  if(S.view==="home"){ bar.innerHTML=""; return; }
  if(S.view==="qintro"){ bar.innerHTML=`<div class="bar-in"><button class="btn btn-ghost" data-a="back">${L("Trước","Back")}</button><button class="btn btn-primary" data-a="qstart">${L("Bắt đầu 8 câu hỏi","Start 8 questions")}</button></div>`; return; }
  if(S.view==="quick"){ bar.innerHTML=`<div class="bar-in"><button class="btn btn-ghost" data-a="back">${L("Trước","Back")}</button><button class="btn btn-ghost" style="flex:1" data-a="qskip">${L("Bỏ qua, dùng giả định","Skip, use assumption")}</button></div>`; return; }
  if(S.view==="reveal"){ bar.innerHTML=`<div class="bar-in"><button class="btn btn-ghost" data-a="deep">${L("Hỏi chi tiết","Deep-dive")}</button><button class="btn btn-primary" data-a="toplan">${L("Xem kế hoạch nâng điểm","See the plan")}</button></div>`; return; }
  if(S.view==="wizard"){
    const st=STEPS[S.step]; const canNext = S.step===0? !!S.c.segment : true;
    const last = S.step===STEPS.length-2;
    bar.innerHTML=`<div class="bar-in">${S.step>0?`<button class="btn btn-ghost" data-a="prev">${L("Trước","Back")}</button>`:""}<button class="btn btn-primary" data-a="next" ${canNext?"":"disabled"}>${last?L("Xem kế hoạch","See the plan"):L("Tiếp tục","Continue")}</button></div>`;
    return;
  }
  bar.innerHTML=`<div class="bar-in"><button class="btn btn-ghost" data-a="home">${L("Danh sách","Clients")}</button><button class="btn btn-primary" data-a="save">${S.c.demo?L("Tư vấn khách mới","New session"):L("Lưu hồ sơ","Save client")}</button></div>`;
}

function render(){
  document.documentElement.lang=LANG;
  let body="";
  if(S.view==="home") body=viewHome();
  else if(S.view==="wizard") body = S.step===0? viewSegment() : viewStep();
  else if(S.view==="qintro") body=viewQuickIntro();
  else if(S.view==="quick") body=viewQuick();
  else if(S.view==="reveal") body=viewReveal();
  else body=viewReport();
  app.innerHTML=topbar()+body; renderBar();
  if(S.view==="reveal") animateReveal();
}

/* ---------------- events ---------------- */
function go(view,step){ S.view=view; if(step!=null) S.step=step; S.confirmDel=false; render(); window.scrollTo(0,0); }
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return; const a=b.dataset.a;
  if(a==="lang"){ LANG=b.dataset.v; try{localStorage.setItem("ac-lang",LANG);}catch(_){ } render(); return; }
  if(a==="new"){ S.c=blankClient(); go("wizard",0); return; }
  if(a==="open"){ const id=b.dataset.id; const c = id==="demo"? JSON.parse(JSON.stringify(DEMO)) : S.clients.find(x=>x.id===id); if(!c) return; S.c=JSON.parse(JSON.stringify(c)); go("report"); return; }
  if(a==="seg"){ S.c.segment=b.dataset.v; render(); return; }
  if(a==="choice"){ const k=b.dataset.k; S.c[k]= S.c[k]===b.dataset.v? null : b.dataset.v; render(); return; }
  if(a==="multi"){ const k=b.dataset.k; const arr=new Set(S.c[k]||[]); arr.has(b.dataset.v)?arr.delete(b.dataset.v):arr.add(b.dataset.v); S.c[k]=[...arr]; render(); return; }
  if(a==="hold"){ const arr=new Set(S.c.holdings||[]); arr.has(b.dataset.v)?arr.delete(b.dataset.v):arr.add(b.dataset.v); S.c.holdings=[...arr]; render(); return; }
  if(a==="kidadd"){ S.c.kids=(S.c.kids||[]).concat([{age:null,plan:"public",cost:null}]); render(); return; }
  if(a==="kiddel"){ S.c.kids=(S.c.kids||[]).filter((_,i)=>i!==+b.dataset.i); render(); return; }
  if(a==="kidplan"){ const k=S.c.kids[+b.dataset.i]; k.plan=b.dataset.v; k.cost=null; render(); return; }
  if(a==="deps"){ S.c.dependents=+b.dataset.v; if(S.c.family==null) S.c.family=S.c.dependents>0?"kids":null; render(); return; }
  if(a==="qstart"){ S.q=0; go("quick"); return; }
  if(a==="qans"||a==="qskip"){ const Q=QUICK[S.q]; S.c.qc=Object.assign({},S.c.qc||{}); if(a==="qans") S.c.qc[Q.k]=b.dataset.v; applyQuick(S.c);
    if(a==="qans"){ render(); setTimeout(()=>{ if(S.q<QUICK.length-1){ S.q++; go("quick"); } else go("reveal"); },220); }
    else { if(S.q<QUICK.length-1){ S.q++; go("quick"); } else go("reveal"); } return; }
  if(a==="toplan"){ go("report"); return; }
  if(a==="deep"){ go("wizard",1); return; }
  if(a==="next"){ if(S.step===0){ go("qintro"); return; } if(S.step>=STEPS.length-2) go("report"); else go("wizard",S.step+1); return; }
  if(a==="prev"){ go("wizard",Math.max(0,S.step-1)); return; }
  if(a==="back"&&S.view==="qintro"){ go("wizard",0); return; }
  if(a==="back"&&S.view==="quick"){ if(S.q>0){ S.q--; go("quick"); } else go("qintro"); return; }
  if(a==="back"&&S.view==="reveal"){ S.q=QUICK.length-1; go("quick"); return; }
  if(a==="back"){ if(S.view==="wizard"&&S.step>0) go("wizard",S.step-1); else if(S.view==="report"&&!S.c.demo&&!S.c.id) go("wizard",STEPS.length-2); else go("home"); return; }
  if(a==="home"){ go("home"); return; }
  if(a==="edit"){ if(S.c.demo){ S.c.demo=false; S.c.id=null; S.c.name=S.c.name+" (copy)"; } go("wizard",1); return; }
  if(a==="save"){ if(S.c.demo){ S.c=blankClient(); go("wizard",0); } else saveClient(); return; }
  if(a==="copy"){ copySummary(); return; }
  if(a==="del"){ S.confirmDel=true; render(); return; }
  if(a==="del-no"){ S.confirmDel=false; render(); return; }
  if(a==="del-yes"){ deleteClient(); return; }
});
document.addEventListener("input",e=>{ setTimeout(updateLive,0);
  const el=e.target; if(el.dataset&&el.dataset.kid!=null&&S.c){ const kk=S.c.kids[+el.dataset.kid]; kk[el.dataset.f]= el.value===""? null : Number(el.value); return; }
  const k=el.dataset&&el.dataset.k; if(!k||!S.c) return;
  if(el.type==="number"){ S.c[k]= el.value===""? null : Number(el.value); const conv=document.querySelector(`[data-conv="${k}"]`); if(conv){ const d=(DEFAULTS[S.c.segment]||{})[k]; const shown=S.c[k]==null?d:S.c[k]; const f=STEPS[S.step]&&visibleFields(STEPS[S.step]).find(x=>x.k===k); conv.textContent = f&&f.uvi&&/tr ₫/.test(f.uvi)&&n0(shown)>=1000? "= "+fmtM(shown)+(S.c[k]==null?" · "+L("giả định","assumed"):"") : ""; } }
  else if(el.type==="range"){ S.c[k]=Number(el.value); const o=document.querySelector(`[data-out="${k}"]`); if(o) o.textContent=el.value+"%"; const w=el.closest(".range"); if(w) w.classList.remove("is-sug"); }
  else S.c[k]=el.value;
});

function copySummary(){
  const c=S.c, r=analyse(c), seg=SEGMENTS[c.segment];
  const lines=[`${c.name||L("Khách hàng","Client")} · ${L(seg.vi,seg.en)} · ${L("Sức khoẻ tài chính","Financial health")}: ${r.overall}/100 (${L(tierOf(r.overall).vi,tierOf(r.overall).en)})`, "",
    ...PILLARS.map(p=>`${L(p.vi,p.en)}: ${r.scores[p.k]}`), "", L("Ưu tiên hành động:","Priority actions:"),
    ...r.needs.map((n,i)=>`${i+1}. [${sevLabel(n.sev)}] ${n.t}: ${n.a}`)];
  if(c.followUp) lines.push("", L("Hẹn rà soát: ","Review date: ")+c.followUp);
  const txt=lines.join("\n");
  const fallback=()=>{ const ta=document.getElementById("f-notes"); toast(L("Không truy cập được clipboard","Clipboard unavailable")); };
  try{ navigator.clipboard.writeText(txt).then(()=>toast(L("Đã sao chép tóm tắt","Summary copied")),fallback); }catch(_){ fallback(); }
}

render();
initStore();
})();
</script>
